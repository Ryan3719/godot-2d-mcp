name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.9.28
      - name: Sync dependencies
        run: uv sync --project server --locked --dev
      - name: Test
        run: uv run --project server pytest server/tests
      - name: Lint
        run: uv run --project server ruff check server scripts/godot_smoke.py

  godot-smoke:
    name: Godot 4.7 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.9.28
      - name: Install Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.0"
          use-dotnet: false
      - name: Sync dependencies
        run: uv sync --project server --locked --dev
      - name: Run real editor smoke test
        run: timeout --kill-after=10s 120s xvfb-run --auto-servernum env GODOT_2D_MCP_SMOKE_TRACE=1 uv run --project server python -u scripts/godot_smoke.py --godot godot
